<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No user-scalable/maximum-scale: blocking zoom is an accessibility fail;
         touch-action:manipulation already prevents double-tap zoom during play. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#062b3a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Underwater Flappy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #041e2a;
        height: 100%;
        overflow: hidden;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Underwater Flappy game"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
